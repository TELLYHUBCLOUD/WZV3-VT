services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      PYTHONUNBUFFERED: "1"
      PORT: "8080"
    volumes:
      - ./config.py:/usr/src/app/config.py:ro
      - ./accounts:/usr/src/app/accounts
      - ./downloads:/usr/src/app/downloads
      - ./logs:/usr/src/app/logs
      - ./rclone:/usr/src/app/rclone
      - ./thumbnails:/usr/src/app/thumbnails
      - tunnel_data:/data:ro
    ports:
      - "8080:8080"
    expose:
      - "8080"
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  tunnel:
    build:
      context: .
      dockerfile: tunnel.Dockerfile
    restart: unless-stopped
    network_mode: "service:app"
    volumes:
      - tunnel_data:/data

